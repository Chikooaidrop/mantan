<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .player {
      width: 100%;
      max-width: 900px;
      padding: 10px;
      box-sizing: border-box;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="player">
    <video controls playsinline>
      <source src="https://cdn.videy.co/XCI8FmXC1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
